          <li><b>المرحلة</b> — حرّكها: قيد الاتصال ← مؤهَّل ← تم اقتراح مشروع ← زيارة مبرمجة.</li>
          <li><b>ملاحظة</b> — بجملة: شنوّة يحبّ، وشنوّة منعو، وشنوّة وعدتو بيه.</li>
          <li><b>الموعد الجاي</b> — نهار الزيارة ولا نهار المعاودة. بلا نهار، الملف يضيع.</li>
        </ul>

        <h3>وابعث</h3>
        <div class="say">تشرّفنا السيد [الاسم]. هاذي صفحة العرض اللي حكينا عليه: agrized.site<br>
        موعدنا [النهار] على [الساعة] في [المكان]. وكان طرا طارئ، كلّمني.</div>

        <h3>القاعدة الوحيدة</h3>
        <p>اللي ما يتكتبش في الـBack Office ما صارش. زميلك اللي باش ياخذ الملف منّك ما يسمعش مكالمتك.</p>`
    }
  ];

  const OBJ = [
    { q: "«كيفاش نتأكّد أنّها حقيقية؟»",
      a: `<div class="say">سؤال في محلّو، وأنا نحبّك تسألو. علاش ما تمشيش تشوف الأرض بعينيك قبل ما تخلّص فلس؟
          الزيارة مجانية. وكي تجي، تشوف الأرض والزيتون والوثائق.</div>
          <p class="note">ما تدافعش بالكلام. الزيارة هي الجواب.</p>` },
    { q: "«قدّاش نربح؟» / «شنوّة المردودية؟»",
      a: `<div class="say">ما نعطيش أرقام مردودية، وهذا مقصود — الإنتاج يتبدّل حسب الموسم والمطر.
          اللي نضمنولك هو: زيتونة مرقّمة باسمك في عقد، أرض تنجّم تزورها، وزيت من زيتونك في آخر الموسم.</div>
          <div class="warn"><b>ما تزيدش كلمة.</b> أي رقم تقولو هنا يولّى وعد.</div>` },
    { q: "«غالية»",
      a: `<div class="say">نفهمك. أمّا خلّينا نشوفو شنوّة فيها: السعر فيه الزيتونة <b>ومساحتها من الأرض</b>.
          في بوعرادة، 1,172 دينار فيهم 150 متر مربّع أرض. ونجّم تبدا بزيتونة وحدة، ولا بالتقسيط.</div>
          <p class="note">وكان حابّ عدد أكبر، فكّرو بالتخفيض: من 10 زيتونات 10%، ومن 25 يولّي 15%.</p>` },
    { q: "«ما عنديش فلوس توّا»",
      a: `<div class="say">ما يلزمكش مبلغ كبير. تبدا بزيتونة وحدة، ولا بالتقسيط الشهري كان العرض يسمح.
          والتسجيل مجاني وما يلزمك بشيء — نبعثلك المعلومات وتقرّر كي تكون جاهز.</div>` },
    { q: "«نخمّم ونعاودلك»",
      a: `<div class="say">طبيعي، وما نحبّكش تستعجل. خلّينا نعملو حاجة: نحجزلك زيارة للأرض —
          مجانية وما تلزمك بشيء — وبعد ما تشوف تقرّر على راحتك. السبت ولا الأحد يمشيلك؟</div>
          <p class="note">كان رفض الزيارة زادة، اطلب نهار للمعاودة. ما تخرجش بلا نهار.</p>` },
    { q: "«وين الأرض بالضبط؟»",
      a: `<div class="say">[العرض] في [الولاية]، معتمدية [...]. نبعثلك الموقع والصور على واتساب في التوّ،
          وكان حبّيت نمشيو نشوفوها مع بعضنا.</div>` },
    { q: "«وشكون يتلهّى بالزيتون؟»",
      a: `<div class="say">إحنا. التقليم والحرث والمتابعة الفلاحية — بـ15 دينار في العام للزيتونة.
          وكل أشغال تصير، تلقاها مكتوبة في حسابك مع الصور.</div>` },
    { q: "«ونجّم نبيعها بعد؟»",
      a: `<div class="say">الزيتونة ملكك بعقد. كان حبّيت تبيعها في المستقبل، نتفاهمو ساعتها —
          أمّا هذا سؤال يتجاوب عليه في العقد ماشي في التلفون. نحبّ نعطيك الجواب الدقيق مكتوب.</div>
          <div class="warn"><b>ما تخترعش شروط.</b> ارجع للمسؤول وعاودلو بجواب مكتوب.</div>` },
    { q: "«أنا برّا تونس»",
      a: `<div class="say">ما فماش مشكل، عندنا برشا حرفاء بالخارج. نوريوك الأرض بالفيديو،
          ونرتّبو الإمضاء من بلاد إقامتك. وكي ترجع للبلاد، تلقى أرضك تستنّاك.</div>` },
    { q: "«ما نثقش في هالحكايات»",
      a: `<div class="say">عندك الحقّ تحذر، وأنا ما نحبّكش تثق فيّا بالكلام.<br>
          تعال شوف الأرض، واقرا الوثائق، وبعدها قرّر. وكان ما عجبكش، ما خسرت شيء.</div>
          <p class="note">ما تتصادمش معاه. اعرض الدليل بدل ما تدافع.</p>` },
    { q: "«ابعثلي معلومات برك»",
      a: `<div class="say">نبعثلك في التوّ. وباش ما نبعثلكش حاجة ما تنفعكش — تحبّ معلومات على عرض معيّن
          ولا على الثلاثة الكلّ؟</div>
          <p class="note">خذ منّو معلومة قبل ما تسكّر، واتّفق على نهار معاودة.</p>` },
    { q: "«كلّمني مرّة أخرى»",
      a: `<div class="say">بالطبيعة. وقتاش يناسبك — نهار [اقترح نهار] على [اقترح ساعة]؟</div>
          <p class="note">نهار محدّد، وسجّلو. «نعاودلك» بلا نهار تعني ما عادش.</p>` }
  ];

  let open = 0;

  function objHtml() {
    return `<input class="search" id="objq" type="search" placeholder="لوّج على اعتراض… مثال: غالية، نخمّم، مردودية" aria-label="بحث في الاعتراضات">
      <div id="objlist">${OBJ.map((o) =>
        `<details class="obj"><summary>${o.q}</summary><div class="in">${o.a}</div></details>`).join("")}</div>`;
  }

  function render() {
    document.getElementById("rail").innerHTML = STEPS.map((s, i) =>
      `<button class="step" type="button" aria-current="${i === open}"><b>${s.n}</b><span>${s.k}</span></button>`).join("");
    const s = STEPS[open];
    document.getElementById("panes").innerHTML =
      `<section class="pane"><h2>${s.k}</h2><p class="goal">${s.goal}</p>${s.objections ? objHtml() : s.html}</section>`;

    document.querySelectorAll(".step").forEach((b, i) =>
      b.addEventListener("click", () => { open = i; render(); window.scrollTo({ top: 0, behavior: "smooth" }); }));

    const q = document.getElementById("objq");
    if (q) q.addEventListener("input", () => {
      const t = q.value.trim();
      document.querySelectorAll("#objlist .obj").forEach((d) => {
        d.hidden = t !== "" && !d.textContent.includes(t);
      });
    });
  }

  render();
})();
</script>
